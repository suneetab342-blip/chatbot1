
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <header class="chat-header">
      <div class="bot-avatar">🤖</div>
      <div class="header-info">
        <h2>My Chatbot</h2>
        <p><span class="status-dot"></span> Online</p>
      </div>
      <button id="clear-btn" title="Clear chat">🗑️</button>
    </header>

    <main id="chat-box" class="chat-box" aria-live="polite">
      <div class="message bot-message">
        Hello! 👋 Main tumhara chatbot hoon.
        Mujhse kuch bhi poochho!
      </div>
    </main>

    <div class="suggestions">
      <button class="suggestion">Hello</button>
      <button class="suggestion">What is your name?</button>
      <button class="suggestion">Help</button>
    </div>

    <form id="chat-form" class="chat-input">
      <input
        type="text"
        id="user-input"
        placeholder="Type your message..."
        autocomplete="off"
        aria-label="Your message"
        required
      >
      <button type="submit" id="send-btn" aria-label="Send message">
        ➤
      </button>
    </form>

    <footer>Powered by My Chatbot</footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
